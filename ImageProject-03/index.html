<!DOCTYPE html>
<html>
  <head>
  <!-- Load A-Frame -->
  <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

  <!-- Register custom component -->
  <script>
    AFRAME.registerComponent('fix-saturn-rings', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const model = this.el.getObject3D('mesh');

          model.traverse((node) => {
            if (!node.isMesh) return;

            if (node.name.toLowerCase().includes('ring')) {
              const materials = Array.isArray(node.material)
                ? node.material
                : [node.material];

              materials.forEach((mat) => {
                // Make rings visible from both sides
                mat.side = AFRAME.THREE.DoubleSide;

                // Transparency settings
                mat.alphaMap = null;
                mat.transparent = true;
                mat.opacity = 1.0;
                mat.alphaTest = 0.02;
                mat.depthWrite = false;

                mat.needsUpdate = true;
              });

              console.log('Saturn rings updated!', node.name);
            }
          });
        });
      }
    });
  </script>
</head>

  <body>
    <a-scene>
      
      <a-assets>
        <a-asset-item id="planets-mtl" src="Assets/PlanetsOBJ.mtl"></a-asset-item>
        <a-asset-item id="planets-obj" src="Assets/PlanetsOBJ.obj"></a-asset-item>
        <a-asset-item id="ufo-glb" src="Assets/ufo_low-poly.glb"></a-asset-item>
      </a-assets>

      <a-entity obj-model="obj: #planets-obj; mtl: #planets-mtl" fix-saturn-rings position="0 32.75 -1" rotation="0 90 0" scale="0.25 0.25 0.25"></a-entity>
      <a-entity gltf-model="#ufo-glb" position="0 1.33 1" rotation="0 0 0" scale=".025 .025 .025"></a-entity>
      <a-entity gltf-model="#ufo-glb" position="1 1.33 .5" rotation="0 0 0" scale=".025 .025 .025"></a-entity>
      <a-entity gltf-model="#ufo-glb" position="-1 1.33 .5" rotation="0 0 0" scale=".025 .025 .025"></a-entity>

      <a-sky src="Assets/image_portraying_the_adjacent_text..jpg"></a-sky>

    </a-scene>
  </body>
</html>
